version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapic_app
    hostname: snapic_app
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www/html
    environment:
      APP_KEY: "base64:iRM25NrOXLPg2Tgz8WS4oU2PGuvyHrPTNvKg4kH6r3Y="
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "teste"
      DB_USERNAME: "root"
      DB_PASSWORD: "xlspWXLxvjcFmDyLkwgaNbqjQowHxsBm"
      LDAP_LOGGING: "true"
      LDAP_USERNAME: "sala.situacao@saude.df.gov.br"
      LDAP_PASSWORD: "xsalasituacao@dgie"
      LDAP_PORT: "389"
      LDAP_BASE_DN: "dc=saude,dc=df,dc=gov,dc=br"
      LDAP_TIMEOUT: "5"
      LDAP_SSL: "false"
      LDAP_TLS: "false"
      COMPOSER_VERSION: "2.2.0"
