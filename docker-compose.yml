version: "3.9"

services:
  php-apache-backend:
    build:
      context: .
    container_name: snapic_container
    hostname: snapic
    ports:
      - "81:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: snapic_db
      DB_USERNAME: root
      DB_PASSWORD: root_password

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: snapic_db
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
